name: publish-apk

# 用途：把已签名 APK 搬运进仓库 apk/ 目录，作为备用下载通道
# 触发：仅推送 apk-src.txt 到 main（改本文件本身不触发），也可手动 workflow_dispatch
# 文件名取自 update.json 的 version；下载后用 update.json 的 size 校验，防止搬错包
# 注意：GitHub runner 访问国内 CDN 常很慢，超时已收紧，失败时请用 workflow_dispatch 重试
on:
  push:
    branches: [main]
    paths:
      - 'apk-src.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Read source url and target name
        id: src
        run: |
          set -euo pipefail
          URL=$(tr -d '\r\n' < apk-src.txt)
          VERSION=$(python3 -c "import json;print(json.load(open('update.json'))['version'])")
          SIZE=$(python3 -c "import json;print(json.load(open('update.json')).get('size',''))")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "file=apk/BydSignIn-$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "expect=$SIZE" >> "$GITHUB_OUTPUT"
          echo "source: $URL"
          echo "target: apk/BydSignIn-$VERSION.apk expect=$SIZE"

      - name: Download apk
        run: |
          set -euo pipefail
          mkdir -p apk
          curl -L --fail --connect-timeout 20 --max-time 150 --retry 2 --retry-delay 3 \
            -o "${{ steps.src.outputs.file }}" "${{ steps.src.outputs.url }}"
          ls -l apk/

      - name: Verify package
        run: |
          set -euo pipefail
          python3 - <<PY
          import zipfile, hashlib, os
          p = '${{ steps.src.outputs.file }}'
          expect = '${{ steps.src.outputs.expect }}'
          size = os.path.getsize(p)
          assert size > 5_000_000, 'file too small: %d' % size
          if expect:
              assert size == int(expect), 'size mismatch: got %d, update.json says %s' % (size, expect)
          z = zipfile.ZipFile(p)
          names = z.namelist()
          assert 'AndroidManifest.xml' in names, 'not an apk'
          assert 'classes.dex' in names, 'no dex'
          print('entries:', len(names))
          print('size:', size)
          print('sha256:', hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY

      - name: Commit apk
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A apk
          if git diff --cached --quiet; then
            echo 'no change'
          else
            git commit -m "apk: add $(basename "${{ steps.src.outputs.file }}")"
            git push origin HEAD:main
          fi
